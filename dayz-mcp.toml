# Portable half of the profile for dayz-agentic-modding-mcp.
# Machine paths live in dayz-mcp.local.toml, which is not committed.
#
# OpenZone_Trader REQUIRES @OpenZone_Core (requiredAddons): the configs, the
# service registry and the log are the core's, and the core requires CF.

[project]
name = "openzone-trader"

[build]
# OpenZone_Trader             -- the mod. Phase 1: the server half for plain items.
# OpenZone_Trader_Bridge      -- server only: the `oz_trader` verb for the MCP bridge
#                                (scripted deals). A stand tool, never published.
#                                It joins `mods` when its folder exists: the MCP
#                                refuses a project that names a missing one.
# OpenZone_TraderProbe        -- client + server stand tool of phase 0: scenes, the two
#                                inventory dumps, the stand's wallet and notes.
# OpenZone_TraderProbe_Bridge -- server only: the `ozt_probe` verb.
# OpenZone_Trader_VPP         -- the pane TRADERS of the OpenZone admin window, a glue
#                                pbo that hard-requires VPP Admin Tools and the core's
#                                OpenZone_VPP. It joins `mods` on a stand that loads
#                                both: elsewhere the server stops at the missing addon.
#                                Its layout is built by declaring it for one call.
# OpenZone_Trader_TraderPlus  -- the TraderPlus bank as money (provider id `traderplus`),
#                                a glue pbo that hard-requires TraderPlus's banking pbo.
#                                It joins `mods`, and TraderPlus the stand's extra mods,
#                                for a run that tries it.
# OpenZone_Trader_Research    -- the research gate, a glue pbo that hard-requires the
#                                research mod. It joins `mods`, and the research mod
#                                the stand's extra mods, for a run that tries it.
# Since 2026-11-12 this stand loads VPP Admin Tools and TraderPlus from Steam's content
# folder (dayz-mcp.local.toml), so both glues are in `mods`; a machine without them
# takes them out again.
mods = ["OpenZone_Trader", "OpenZone_Trader_VPP", "OpenZone_Trader_TraderPlus", "OpenZone_Trader_Bridge", "OpenZone_TraderProbe", "OpenZone_TraderProbe_Bridge"]
# The layout generator reads the series' design tokens from the core, so the
# trade screen wears the same palette and type as the PDA and the research tree.
# The trader's own file is laid over it: the few colours and sizes a trade
# screen has and the PDA does not.
tokens = ["../openzone-core/ui/tokens.json", "ui/tokens.json"]

[expect]
# Printed by OZT_Module one tick after the mission starts.
ready_line   = "trader loaded"
max_warnings = 0
forbid       = ["Bad type", "Can't compile", "NULL pointer to instance"]
# The engine's errors about our classes, and the mod's own ERROR lines:
# OZT_Log.Error prints a plain `SCRIPT :` line, which the first pattern misses.
error_regex  = ["SCRIPT\\s+\\(E\\).*OZT_", "\\[OpenZone/Trader\\] ERROR"]
# The stand's shared profile has the core's Discord bridge switched on, and no
# bridge process runs for this project: the core says so on every boot. A state
# of this stand, not an event.
noise        = ["Bridge.Url is not https", "bridge: "]

# Read from the ready line. The stand's own files (examples/stand) set them.
[expect.counters]
# The stall and Ostap, a trader's character (phase 4).
traders  = 2
goods    = 90
problems = 0
